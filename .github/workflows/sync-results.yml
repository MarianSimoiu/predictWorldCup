name: Automatic Results Sync

on:
  schedule:
    - cron: '0 8 * * *'    # 10:00 UTC+2 — morning catch-up
    - cron: '30 16 * * *'  # 18:30 UTC+2 — after afternoon games
    - cron: '30 20 * * *'  # 22:30 UTC+2 — after evening games
  workflow_dispatch:
    # Allow manual triggering from the GitHub UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Sync & Score Recalculation
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
        run: node scripts/sync-and-recalculate.js
