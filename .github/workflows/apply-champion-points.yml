name: Admin — Apply Champion Points

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (print what would happen without writing)'
        type: boolean
        default: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Apply champion bonus points
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: node scripts/apply-champion-points.js
